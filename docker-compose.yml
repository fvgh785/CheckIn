services:
  mysql:
    image: mysql:8.0
    container_name: checkin-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: checkin
      MYSQL_USER: checkin
      MYSQL_PASSWORD: checkin123
    volumes:
      - ./data/mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: checkin-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=checkin
      - DB_PASSWORD=checkin123
      - DB_NAME=checkin
      - WX_APP_ID=your_wx_appid
      - WX_APP_SECRET=your_wx_appsecret
