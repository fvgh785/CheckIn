services:
  mysql:
    image: mysql:8.0
    container_name: checkin-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: checkin
      MYSQL_USER: checkin
      MYSQL_PASSWORD: checkin123
      TZ: Asia/Shanghai
    volumes:
      - /data/mysql:/var/lib/mysql
      - ./backend/conf/my.conf:/etc/mysql/conf.d/my.cnf
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: checkin-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=checkin
      - DB_PASSWORD=checkin123
      - DB_NAME=checkin
      - WX_APP_ID=your_wx_appid
      - WX_APP_SECRET=your_wx_appsecret
      - ADMIN_KEY=your_admin_secret_key
      - ADMIN_JWT_SECRET=your-jwt-secret-change-in-production
      - ADMIN_DEFAULT_USERNAME=admin
      - ADMIN_DEFAULT_PASSWORD=admin123
      # SMTP 邮箱验证码配置（网易163邮箱示例，其他邮箱改 SMTP_HOST/SMTP_PORT）
      # 163: smtp.163.com:465  126: smtp.126.com:465  yeah: smtp.yeah.net:465  QQ: smtp.qq.com:465
      - SMTP_HOST=smtp.163.com
      - SMTP_PORT=465
      - SMTP_USER=your_email@163.com
      - SMTP_PASSWORD=your_smtp_auth_code
      - SMTP_FROM_NAME=CCCheckInba
      # AI_API_KEY is optional for AI insights feature
      # - AI_API_KEY=sk-your-deepseek-key

  admin-frontend:
    build: ./admin-frontend
    container_name: checkin-admin
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"
